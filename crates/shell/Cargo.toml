[package]
name = "shell"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "IO for Invoke Git: runs the core's commands through gix and the git CLI and reports events."

[dependencies]
invoke-core = { path = "../core" }
gix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
proptest.workspace = true
