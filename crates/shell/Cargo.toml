[package]
name = "shell"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "IO for Invoke Git: runs the core's commands through gix and the git CLI and reports events."

[dependencies]
invoke-core = { path = "../core" }
askpass = { path = "../askpass" }
gix = { workspace = true, features = ["index", "excludes", "status", "revision", "max-performance"] }
graph = { path = "../graph" }
notify = "8"
rusqlite.workspace = true
# Forge accounts (P8). `reqwest` for the GitHub/GitLab APIs and `keyring` for
# tokens are both in the PRD build-vs-library table. Blocking client on
# purpose: every call runs on a background thread, never in the UI.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
keyring = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
diff = { path = "../diff" }
proptest.workspace = true
