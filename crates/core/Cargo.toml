[package]
name = "invoke-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Pure repo-state core: step(state, event) -> (state, commands). No IO."

# A library named `core` would shadow Rust's built-in `core` crate in every
# dependent, so the package is `invoke-core` and the library `invoke_core`.
[lib]
name = "invoke_core"

[dev-dependencies]
proptest.workspace = true
