[package]
name = "ui"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "GPUI component layer: a thin layer over GPUI that reads every colour, size and spacing from the tokens crate."

[dependencies]
gpui.workspace = true
tokens = { path = "../tokens" }
invoke-core = { path = "../core" }
graph = { path = "../graph" }
diff = { path = "../diff" }
highlight = { path = "../highlight" }

[dev-dependencies]
gpui_platform.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "ui"
harness = false
