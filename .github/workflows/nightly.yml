# Long model-based run (docs/spec/verification.md, "Fixtures and CI"):
# 10000 sequences of up to 40 steps on Linux. A failure prints the shortest
# failing sequence as plain git commands in the job log.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Number of sequences
        default: "10000"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  model-based:
    name: Model-based harness (${{ inputs.cases || '10000' }} sequences)
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
          git --version

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
          key: nightly-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: nightly-cargo-

      - name: Run the harness
        env:
          INVOKE_HARNESS_CASES: ${{ inputs.cases || '10000' }}
          INVOKE_HARNESS_STATS: "1"
        run: cargo test -p harness --test model_based -- --nocapture
