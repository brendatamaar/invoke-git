# CI matrix from docs/spec/verification.md ("Fixtures and CI"):
# Windows builds and tests everything on every push; Linux and macOS run the
# core (non-UI) suite to catch Windows-only assumptions. The diff and graph
# benchmarks run in their own Linux job against docs/perf-budgets.toml (task
# 25). The model-based harness (task 24) runs inside the core suite; the Quint
# specs are checked by quint.yml and the 10000-sequence run is nightly.yml.
# Kani arrives after v0.1.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  windows:
    name: Windows (everything)
    runs-on: windows-latest
    # A cold GPUI build takes about 11 minutes on a laptop; leave headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      # The model-based harness (backlog task 24) starts a few thousand git
      # processes per 256 sequences, which is slow on Windows. Linux and macOS
      # run the full 256 on every push and Linux runs 10000 nightly
      # (nightly.yml); Windows runs 32 here to keep this job short.
      - name: Check (fmt, clippy, tests, all crates)
        env:
          INVOKE_HARNESS_CASES: "32"
        run: cargo xtask check

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The core suite includes the model-based harness: 256 sequences.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      # GPUI is never built here, but Cargo still fetches the pinned Zed
      # repository to resolve the lockfile, so cache the git database too.
      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Check (fmt, clippy, tests, core crates only)
        run: cargo xtask check --core

  # Backlog task 25: criterion benchmarks for the diff engine and the graph
  # layout, failing the build past the absolute ceilings in
  # docs/perf-budgets.toml. A separate job, so a cold release build does not
  # lengthen the Windows job; the viewer and status-tree benchmarks join it
  # when the UI exists. Linux runs the pure crates only, no UI is built.
  bench:
    name: Benchmarks (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: bench-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: bench-cargo-

      - name: Benchmarks against the performance budgets
        run: cargo xtask bench-check
